name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  checks:
    name: Rust and docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.94.0-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-rust-1.94.0-${{ hashFiles('Cargo.lock') }}-
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Unit and fixture tests
        run: cargo test --locked --workspace --all-features --exclude integration_tests
      - name: Enjin Blockchain configuration tests
        run: cargo test --locked -p integration_tests --test chain_config
      - name: Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      - name: Check generated OpenAPI
        run: |
          cargo run --locked --quiet -p polkadot-rest-api --example export_openapi > /tmp/openapi.json
          diff -u docs/openapi.json /tmp/openapi.json
      - name: Build documentation
        run: |
          npm ci --prefix docs
          npm run build --prefix docs
      - name: Build release with embedded documentation
        run: cargo build --locked --release -p polkadot-rest-api
      - name: Smoke script regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Package binary and corresponding source
        run: |
          mkdir -p dist
          cp target/release/enjin-rest-api LICENSE NOTICE dist/
          git archive --format=tar.gz --prefix=blockchain-rest-api/ HEAD > dist/source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: blockchain-rest-api-linux-amd64
          path: dist/
